name: Publish game client update

on:
  push:
    branches:
      - main
    tags:
      - "game-client-v*"

permissions:
  contents: read

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: "false"

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: game-client/pnpm-lock.yaml

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        working-directory: game-client
        run: pnpm install --frozen-lockfile

      - name: Build Android TV APK
        working-directory: game-client
        run: |
          pnpm run build
          pnpm exec cap sync android
          bash android/gradlew --project-dir android assembleDebug
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")"
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            "android/app/build/outputs/apk/debug/ARCADE-TV-${VERSION}-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: arcade-tv-apk
          path: game-client/android/app/build/outputs/apk/debug/ARCADE-TV-*-debug.apk
          if-no-files-found: error

  package-and-release:
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/game-client-v')
    needs: build-android-apk
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
        working-directory: game-client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Build Windows raw mouse bridge
        working-directory: ${{ github.workspace }}
        run: |
          python -m pip install pyinstaller==6.22.3 pywin32==312
          pyinstaller --noconfirm --clean --onedir --windowed `
            --name mouse_event_bridge `
            --distpath game-client/build/mouse-bridge `
            --workpath game-client/build/pyinstaller `
            --specpath game-client/build `
            windows_detector/mouse_event_bridge.py

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: game-client/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows installer
        run: pnpm run dist

      - name: Create update manifest
        run: |
          $tag = $env:GITHUB_REF_NAME
          $expectedVersion = $tag -replace '^game-client-v', ''
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($expectedVersion -ne $packageVersion) {
            throw "Release tag version $expectedVersion does not match package version $packageVersion."
          }

          $installers = @(Get-ChildItem release -File -Filter '*.exe')
          if ($installers.Count -ne 1) {
            throw "Expected one Windows installer, found $($installers.Count)."
          }

          $installer = $installers[0]
          $checksum = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $downloadName = $installer.Name.Replace(' ', '.')
          $encodedName = [uri]::EscapeDataString($downloadName)
          $manifest = [ordered]@{
            version = $packageVersion
            download_url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/$encodedName"
            sha256 = $checksum
          }
          $manifestPath = Join-Path $PWD 'release/client-update.json'
          $manifest | ConvertTo-Json -Compress | Set-Content -Path $manifestPath -Encoding utf8NoBOM
          "INSTALLER_PATH=$($installer.FullName)" >> $env:GITHUB_ENV
          "UPDATE_MANIFEST_PATH=$manifestPath" >> $env:GITHUB_ENV
          "UPDATE_TAG=$tag" >> $env:GITHUB_ENV

      - uses: actions/download-artifact@v4
        with:
          name: arcade-tv-apk
          path: game-client/release/android-apk

      - name: Locate Android TV APK
        run: |
          $apks = @(Get-ChildItem release/android-apk -File -Filter '*.apk')
          if ($apks.Count -ne 1) {
            throw "Expected one Android TV APK, found $($apks.Count)."
          }
          "ANDROID_APK_PATH=$($apks[0].FullName)" >> $env:GITHUB_ENV

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:UPDATE_TAG" "$env:INSTALLER_PATH" "$env:UPDATE_MANIFEST_PATH" "$env:ANDROID_APK_PATH" `
            --title "ARCADE Game Client $((Get-Content package.json -Raw | ConvertFrom-Json).version)" `
            --notes "ARCADE Windows client and Android TV APK. The APK uses temporary CI debug signing; uninstall an older APK before installing if Android reports a signature mismatch."
